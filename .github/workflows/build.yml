name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux / meson
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 GEGL 开发头文件
        run: |
          sudo apt-get update
          sudo apt-get install -y libgegl-dev meson ninja-build pkg-config

      - name: 显示 GEGL 版本
        run: pkg-config --modversion gegl-0.4

      - name: 校验翻译文件（gettext）
        run: |
          # msgid 一律是英文、无重复、无空译；缺译只提示不失败（缺译回落英文原文）
          python3 tools/i18n.py check
          # locale/<lang>/LC_MESSAGES/*.mo 是提交进仓库的运行期产物：C 侧构造函数
          # 和插件的 lb_i18n.py 直接读它，构建过程不生成。改了 po 忘记 build，
          # 用户装到的还是旧译文。这里重新生成一遍（工具自带纯 Python 写入器，
          # 输出是确定性的），与仓库里的那份逐字节比对。
          python3 tools/i18n.py build
          if [ -n "$(git status --porcelain -- locale/)" ]; then
            echo "::error::locale/ 与 po/ 不同步，本地执行 python tools/i18n.py build 后一起提交"
            git status --porcelain -- locale/
            exit 1
          fi
          echo "· 翻译文件与 .mo 一致"

      - name: 校验站点双语（docs/ 是提交进仓库的产物）
        run: python3 tools/check_bilingual.py

      - name: 校验每个算子都有菜单注册
        run: |
          # gegl --info 能查到 ≠ GIMP 菜单里看得见：漏了 gimp:menu-path 的算子
          # 命令行照跑、自检照绿，但在 GIMP 里根本找不到（2026-11-20 踩过）。
          python3 tools/check_menu.py

      - name: 校验 AI 重绘的 HTTP / PNG 链路（mock ComfyUI，不需要显卡）
        run: |
          # 插件本体跑在 GIMP 里（另一套 check 需要 gimp-console），但「上传 → 排队
          # → 轮询 → 取图」这一半是纯标准库，mock 服务就能守：mask 的 alpha 约定、
          # 裁切框对齐 8、工作流结构、三类错误提示文案。
          python3 tools/check_ai_inpaint.py -v

      - name: 安装脚本冒烟（不联网、不装东西）
        run: |
          # setup_ai.py 只在 Windows 上真装，但「能不能 import / 参数表是否完整 /
          # 模型表有没有写坏」这些在任何平台都能守，免得改崩了用户才发现。
          python3 -m py_compile tools/setup_ai.py
          python3 tools/setup_ai.py --help > /dev/null
          python3 -c "import sys; sys.path.insert(0, 'tools'); import setup_ai as S; assert set(S.MODELS) == {'sd15', 'sdxl'}, S.MODELS; assert all(m['urls'] and m['bytes'] > 1 << 30 and m['name'].endswith('.safetensors') for m in S.MODELS.values()); print('setup_ai models ok')"

      - name: 编译全部算子
        run: |
          meson setup build-meson --buildtype=release
          ninja -C build-meson
          # 模块复制到干净的 build/：GEGL 0.4.60+ 会扫描 GEGL_PATH 里的 *.json
          # 注册 JSON 算子，meson 的 intro-*.json（顶层是数组）会让它 g_assert 崩溃
          mkdir -p build
          cp build-meson/*.so build/

      - name: 确认产出模块与 ops/ 源码一一对应
        run: |
          n=$(ls build/*.so | wc -l)
          echo "built: $n"
          ls -la build/*.so | awk '{print $5, $9}'
          # 期望集合直接取自源码目录（跳过 .disabled），产物名 = 源文件名。
          # 不再硬编码数量：meson.build 是需要手工同步的表，漏一项时只报 26≠29
          # 根本看不出漏了谁，这里用集合差把名字打出来。
          for c in ops/*/*.c; do
            [ -f "$(dirname "$c")/.disabled" ] && continue
            basename "$c" .c
          done | sort > /tmp/expected.txt
          (cd build && ls *.so | sed 's/\.so$//') | sort > /tmp/actual.txt
          echo "期望 $(wc -l < /tmp/expected.txt) 个，实际 $(wc -l < /tmp/actual.txt) 个"
          missing=$(comm -23 /tmp/expected.txt /tmp/actual.txt || true)
          extra=$(comm -13 /tmp/expected.txt /tmp/actual.txt || true)
          if [ -n "$missing" ]; then echo "::error::meson.build 漏列或未编出: $(echo $missing)"; fi
          if [ -n "$extra" ]; then echo "::error::编出了源码表外的模块: $(echo $extra)"; fi
          test -z "$missing" && test -z "$extra"

      - name: 验证 .so 能被 GEGL 加载并渲染
        run: ./tools/check-linux.sh

      - name: 上传 Linux 包
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: build/*.so
          retention-days: 90

  macos:
    name: macOS (Apple Silicon) / homebrew GEGL
    # macos-14 已于 2026-11-02 退役；macos-15 是稳定的 arm64 标签
    runs-on: macos-15
    env:
      PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4

      - name: 安装 GEGL
        run: |
          brew install gegl
          brew list --versions gegl

      - name: 显示 GEGL 版本
        run: pkg-config --modversion gegl-0.4

      - name: 编译全部算子
        run: ./build.sh

      - name: 确认产出模块与 ops/ 源码一一对应（GEGL 0.4.60+ 在 macOS 只认 .dylib，不是 .so）
        run: |
          n=$(ls build/*.dylib | wc -l)
          echo "built: $n"
          ls -la build/*.dylib | awk '{print $5, $9}'
          for c in ops/*/*.c; do
            [ -f "$(dirname "$c")/.disabled" ] && continue
            basename "$c" .c
          done | sort > /tmp/expected.txt
          (cd build && ls *.dylib | sed 's/\.dylib$//') | sort > /tmp/actual.txt
          echo "期望 $(wc -l < /tmp/expected.txt) 个，实际 $(wc -l < /tmp/actual.txt) 个"
          missing=$(comm -23 /tmp/expected.txt /tmp/actual.txt || true)
          extra=$(comm -13 /tmp/expected.txt /tmp/actual.txt || true)
          if [ -n "$missing" ]; then echo "::error::未编出: $(echo $missing)"; fi
          if [ -n "$extra" ]; then echo "::error::多出未声明的模块: $(echo $extra)"; fi
          test -z "$missing" && test -z "$extra"

      - name: 验证 .so 能被 GEGL 加载并渲染
        run: ./tools/check-linux.sh

      - name: 上传 macOS 包
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build/*.dylib
          retention-days: 90

