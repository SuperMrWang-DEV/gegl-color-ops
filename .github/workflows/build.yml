name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux / meson
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 GEGL 开发头文件
        run: |
          sudo apt-get update
          sudo apt-get install -y libgegl-dev meson ninja-build pkg-config

      - name: 显示 GEGL 版本
        run: pkg-config --modversion gegl-0.4

      - name: 编译全部算子
        run: |
          meson setup build-meson --buildtype=release
          ninja -C build-meson
          # 模块复制到干净的 build/：GEGL 0.4.60+ 会扫描 GEGL_PATH 里的 *.json
          # 注册 JSON 算子，meson 的 intro-*.json（顶层是数组）会让它 g_assert 崩溃
          mkdir -p build
          cp build-meson/*.so build/

      - name: 确认产出 14 个模块
        run: |
          n=$(ls build/*.so | wc -l)
          echo "built: $n"
          ls -la build/*.so | awk '{print $5, $9}'
          test "$n" -eq 14

      - name: 验证 .so 能被 GEGL 加载并渲染
        run: ./tools/check-linux.sh

      - name: 上传 Linux 包
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: build/*.so
          retention-days: 90

  macos:
    name: macOS (Apple Silicon) / homebrew GEGL
    # macos-14 已于 2026-11-02 退役；macos-15 是稳定的 arm64 标签
    runs-on: macos-15
    env:
      PKG_CONFIG_PATH: /opt/homebrew/lib/pkgconfig
    steps:
      - uses: actions/checkout@v4

      - name: 安装 GEGL
        run: |
          brew install gegl
          brew list --versions gegl

      - name: 显示 GEGL 版本
        run: pkg-config --modversion gegl-0.4

      - name: 编译全部算子
        run: ./build.sh

      - name: 确认产出 14 个 .dylib（GEGL 0.4.60+ 在 macOS 只认 .dylib，不是 .so）
        run: |
          n=$(ls build/*.dylib | wc -l)
          echo "built: $n"
          ls -la build/*.dylib | awk '{print $5, $9}'
          test "$n" -eq 14

      - name: 验证 .so 能被 GEGL 加载并渲染
        run: ./tools/check-linux.sh

      - name: 上传 macOS 包
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: build/*.dylib
          retention-days: 90

